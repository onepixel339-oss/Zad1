<div class="wrap"><div id="stage" class="tile rounded"><span id="w" class="word">زاد</span></div></div>
<script>
  const p = new URLSearchParams(location.search);
  const size = Number(p.get('size')||512);
  const maskable = p.get('maskable')==='1';
  const scale = size/512;
  document.querySelector('.wrap').style.width = size+'px';
  document.querySelector('.wrap').style.height = size+'px';
  const stage = document.getElementById('stage');
  stage.classList.toggle('rounded', !maskable);
  stage.classList.toggle('fullbleed', maskable);
  const w = document.getElementById('w');
  w.style.fontSize = (maskable? 175*scale : 230*scale)+'px';
</script>
